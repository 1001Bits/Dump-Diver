; Dump Diver - finds what a frozen game is waiting for and which mod is responsible.
; With SKSE Menu Framework installed, most options are also in its Mod Control Panel under Dump Diver.

[General]
; Start DumpDiverHelper.exe with the game. It watches the game from outside and writes the reports.
StartHelper=1
; Record which plugin queued each task the game runs (lets Dump Diver name the mod behind a stuck task).
TrackTasks=1
; Notice game locks a mod leaves locked (lets Dump Diver name the mod when the game later waits on one forever).
TrackLocks=1
; How often the game is asked to answer, in milliseconds.
HeartbeatMs=100
; Watch the game's loading screen (finds it by name, no game addresses), to catch endless loading screens.
WatchLoadingScreens=1
; Where reports go. Empty: Documents\My Games\<game>\SKSE\DumpDiver (or F4SE\DumpDiver).
OutputDir=

[Freeze]
; Seconds without an answer before the game counts as frozen.
FreezeSeconds=10
; The same while a save or a loading screen is loading.
LoadingSeconds=120
; A loading screen up longer than this, while the game still runs, is reported as endless. The limit
; grows to three times the longest loading screen seen in the session (up to 15 minutes).
LoadingScreenSeconds=180
; The same before the game reaches the main menu the first time.
StartupSeconds=600
; How long a frozen game is watched before the report is written, and how often per second.
SampleMilliseconds=3000
SampleHz=40
; Also write a .dmp next to the report (about 1 MB; the newest 5 are kept). FullMemoryDump=1 writes all game memory (several GB).
WriteDump=1
FullMemoryDump=0
; Also write a .dmp for stalls the game recovered from on its own (their report is always written).
KeepRecoveredStalls=0
; After a freeze report, ask "It looks like your game is frozen. Quit game and open freeze report?"
FreezePrompt=1
; Key that captures the game at any time (for anything the automatic checks miss). Set to none to turn it off.
ManualHotkey=Ctrl+Shift+F10
; Number of reports kept; older ones are deleted.
MaxReports=20
